services:
  - type: web
    name: linkplease-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: DATABASE_PATH
        value: linkplease.db
      - key: API_KEY
        sync: false
